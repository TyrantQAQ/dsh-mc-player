<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="MC Player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a33"/>
      <stop offset="1" stop-color="#0f191f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe06a"/>
      <stop offset="1" stop-color="#5fbf43"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#6b431f"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#71482a"/>
      <stop offset="1" stop-color="#4f3018"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- 地面阴影 -->
  <ellipse cx="64" cy="104" rx="34" ry="8" fill="#000" opacity="0.35"/>

  <!-- 草方块（等距） -->
  <polygon points="64,40 96,56 64,72 32,56" fill="url(#top)"/>
  <polygon points="32,56 64,72 64,100 32,84" fill="url(#left)"/>
  <polygon points="96,56 64,72 64,100 96,84" fill="url(#right)"/>

  <!-- 草皮边缘 -->
  <polygon points="32,56 64,72 64,79 32,63" fill="#3f8f2c" opacity="0.85"/>
  <polygon points="96,56 64,72 64,79 96,63" fill="#357a25" opacity="0.85"/>

  <!-- 一点像素纹理 -->
  <rect x="41" y="63" width="5" height="5" fill="#000" opacity="0.18"/>
  <rect x="52" y="72" width="5" height="5" fill="#000" opacity="0.18"/>
  <rect x="82" y="65" width="5" height="5" fill="#000" opacity="0.18"/>
  <rect x="74" y="79" width="5" height="5" fill="#000" opacity="0.18"/>

  <!-- 心跳：小脑在跑 -->
  <path d="M40 30 h12 l5 -12 l7 24 l6 -12 h18" fill="none" stroke="#ff5d73" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- 心 -->
  <path d="M93 24c3-4 10-3 10 3 0 5-10 11-10 11s-10-6-10-11c0-6 7-7 10-3z" fill="#ff5d73"/>
</svg>
